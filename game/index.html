<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ridge Runner — Coastal Ring Run</title>
<link rel="icon" href="data:,">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0a1626;
    height: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Courier New", monospace;
  }
  #wrap {
    position: relative;
    width: min(100vw, calc(100vh * 1.6));
    aspect-ratio: 1280 / 800;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #2e5f9e;
  }
  #status {
    position: absolute;
    left: 10px;
    bottom: 8px;
    color: rgba(255, 255, 255, 0.55);
    font-size: 12px;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="1280" height="800"></canvas>
    <div id="status">Ridge Runner — arrows fly, W/S throttle, P pause, M mute</div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
